# Lokal geliştirme altyapısı.
# Değerler aynı klasördeki .env dosyasından okunur (şablon: .env.example).

services:
  postgres:
    image: postgres:14
    container_name: critify-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-critify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: ${POSTGRES_DB:-critify_db}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-critify} -d ${POSTGRES_DB:-critify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
